name: Security and regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: bandit -q -r app start.py -ll
      - run: pip-audit --progress-spinner off
      - run: docker compose config --quiet
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t m3mx:test .
      - name: Check hardened startup
        run: |
          docker run -d --name m3mx-check --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp --tmpfs /app/state:uid=10001,gid=10001 --tmpfs /app/uploads:uid=10001,gid=10001 --tmpfs /app/outputs:uid=10001,gid=10001 -p 127.0.0.1:5000:5000 m3mx:test
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:5000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs m3mx-check
          exit 1
      - if: always()
        run: docker rm -f m3mx-check || true
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - name: Verify local browser workflows
        env:
          M3MX_STATE_DIR: ${{ runner.temp }}/m3mx/state
          M3MX_UPLOADS_DIR: ${{ runner.temp }}/m3mx/uploads
          M3MX_OUTPUTS_DIR: ${{ runner.temp }}/m3mx/outputs
        run: |
          gunicorn --bind 127.0.0.1:5057 --workers 1 --worker-class gthread --threads 8 app.wsgi:application &
          task_server=$!
          trap 'kill "$task_server"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:5057/api/health; then break; fi
            sleep 1
          done
          python tests/browser_smoke.py http://127.0.0.1:5057

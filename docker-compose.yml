# M3MX — single-service compose stack.
#
# By default the container binds 127.0.0.1:5000. M3MX has no auth and
# was designed for a single trusted analyst — DO NOT change the bind
# to 0.0.0.0:5000 without putting a reverse proxy with auth in front.
services:
  m3mx:
    build:
      context: .
      dockerfile: Dockerfile
    image: m3mx:latest
    container_name: m3mx
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./config.json:/app/config.json
      - ./rules:/app/rules:ro
    # Let the agent reach a host-side Ollama daemon when the user runs one.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONUNBUFFERED=1
      - VOL3_ALLOW_PARTIAL_DUMP=1
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

services:
  m3mx:
    build: .
    image: m3mx:local
    restart: unless-stopped
    user: "10001:10001"
    ports:
      - "127.0.0.1:5000:5000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 4g
    cpus: 2
    volumes:
      - m3mx-uploads:/app/uploads
      - m3mx-outputs:/app/outputs
      - m3mx-state:/app/state
      - ./rules:/app/rules:ro
    tmpfs:
      - /tmp:size=128m,mode=1777
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      M3MX_STATE_DIR: /app/state
      M3MX_OLLAMA_URL: http://host.docker.internal:11434
      M3MX_OLLAMA_ENDPOINTS: http://host.docker.internal:11434
      VOL3_PATH: /app/bin/vol
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GLM_API_KEY: ${GLM_API_KEY:-}
      AGENTROUTER_API_KEY: ${AGENTROUTER_API_KEY:-}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
volumes:
  m3mx-uploads:
  m3mx-outputs:
  m3mx-state:
